# Postgres para dev local (ADR-002 — banco único: domínio + river na Fase 3).
services:
  postgres:
    image: postgres:16-alpine
    container_name: rizomai-postgres
    environment:
      POSTGRES_USER: rizomai
      POSTGRES_PASSWORD: rizomai
      POSTGRES_DB: rizomai
    ports:
      # Host 5433 → container 5432: evita conflito com Postgres local existente
      # na 5432 (comum em máquinas dev).
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rizomai -d rizomai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
