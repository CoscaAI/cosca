name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (build + vet + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  openapi:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint OpenAPI (spec-first — ADR-005)
        run: npx --yes @redocly/cli lint openapi/rizomai.yaml
