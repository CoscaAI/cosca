# heuristics/H-002-ci-threshold-is-truth.yaml
id: H-002
title: "O threshold que vale é o que o CI executa, não o que a documentação diz"
domain: testing
type: anti-pattern
severity: critical
source_agents: [cosca-kernel, cosca-qa, cosca-platform, cosca-review, cosca-devops]
description: >
  Documentação declarava 70-80% de cobertura como requisito, mas o CI executava
  com threshold de 55% (e continue-on-error: true, tornando o gate inoperante).
  Havia 4 valores diferentes para o mesmo gate: Makefile 40%, CI 55%,
  documentação 70%, embed 80%. Ninguém sabia qual era o número real.
evidence:
  - "2026-07-29: Kernel L19 — 'Tínhamos 4 valores (40%, 55%, 70%, 80%) e o único que importava era o 55% do CI. A documentação era ficção.'"
  - "2026-07-28: Platform agent — docs/developer-guide/testing.md declara 80%+; realidade é 46.5%; CI gate G5 usa 55%"
  - "2026-07-29: Coverage audit — Makefile quality-check usa 40% como 'warning threshold'"
  - "2026-07-28: Review agent — 'continue-on-error: true torna um gate inútil'"
  - "2026-07-28: QA agent — coverage piso de 70% é 'realista para baseline ~78%' mas CI não executa isso"
action: "Auditar sempre o que está rodando (grep no CI workflow, make coverage-check real), não o que está escrito nos docs. Sincronizar documentação com CI ou sincronizar CI com documentação — nunca manter divergentes."
related: [H-001, H-003, H-011]
tags: [testing, ci, coverage, thresholds, documentation-drift, anti-pattern, quality-gates]
confidence: 0.95
created: 2026-07-29
