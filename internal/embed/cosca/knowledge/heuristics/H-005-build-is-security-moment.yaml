# heuristics/H-005-build-is-security-moment.yaml
id: H-005
title: "O build é o momento mais crítico da segurança: proteção deve ser atômica"
domain: security
type: pattern
severity: critical
source_agents: [cosca-kernel, cosca-security]
description: >
  Qualquer janela entre "compilou" e "protegeu" é um vetor de ataque.
  O binário deve ser protegido no mesmo instante da compilação.
  `chmod 000` é exagero — o binário precisa estar LEGÍVEL (para copiar
  para jaula, administrar), só não pode ser EXECUTÁVEL diretamente.
  `chmod -x` (644) é o ponto certo: legível pelos pais, não executável
  sem supervisão. O target `install` tradicional (`install -m 0755`)
  quebra essa proteção e precisa ser substituído.
evidence:
  - "2026-07-29: Kernel L14 — 'Proteger o filho [...] pode ser lido, editado, administrado pelos pais (Don + Kernel). Só não pode sair correndo sem supervisão'"
  - "2026-07-29: Makefile — target `build` executa `chmod -x` como último passo da compilação (644)"
  - "2026-07-29: Makefile — target `build-dev` alternativo sem proteção para desenvolvimento local"
  - "2026-07-29: protect-cosca.sh substituído por proteção embutida no build — sem script externo"
action: "Todo target de build deve executar `chmod -x` como último passo. Target `install` deve usar script de proteção, não `install -m 0755`. CI deve usar build protegido. Manter `build-dev` para desenvolvimento local."
related: [H-001, H-006, H-020]
tags: [security, build, binary-protection, chmod, makefile, atomic, least-privilege]
confidence: 0.95
created: 2026-07-29
