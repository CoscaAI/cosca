# heuristics/H-008-parallel-delegation-context.yaml
id: H-008
title: "Delegação paralela não exige dependência sequencial se contexto for fornecido"
domain: orchestration
type: pattern
severity: high
source_agents: [cosca-kernel, cosca-ceo]
description: >
  Agentes com dependências entre si NÃO precisam ser executados sequencialmente
  se o contexto relevante for fornecido no prompt de cada um. Nas Ondas 5 e 6,
  o Kernel ativou 14 agentes simultaneamente (6 + 8) sem execução sequencial,
  cada um com prompt estruturado (contexto + escopo + deliverables + formato de
  retorno). O resultado: cross-audit synthesis emergiu naturalmente — platform
  correlacionou achados de infra e provider; CTO e CEO validaram os mesmos
  gargalos independentemente.
evidence:
  - "2026-07-28: Kernel L10 — 'Dependências entre agentes não exigem execução sequencial se contexto for fornecido no prompt'"
  - "2026-07-28: Onda 5 — 6 agentes simultâneos (AI, Analytics, Infrastructure, Provider, Mobile, Platform)"
  - "2026-07-28: Onda 6 — 8 agentes simultâneos (CTO, Product, Memory-Chief, Paradigm, CEO, Evolution, Release, UIUX)"
  - "2026-07-28: CEO — cross-source synthesis revela dependências invisíveis em qualquer fonte individual"
action: "Para ativação paralela: prompt estruturado com (1) contexto compartilhado, (2) escopo individual, (3) deliverables específicos, (4) formato de retorno padronizado. Consolidar relatórios pós-execução para cross-audit synthesis."
