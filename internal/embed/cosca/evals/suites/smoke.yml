suite: cosca-esteira-smoke
metadata:
  author: cosca-kernel
  description: "Smoke benchmark da esteira"
  difficulty: easy
  category: pipeline
  tags: [smoke, esteira, regression]
  created: "2026-08-11"
defaults:
  timeouts:
    plan_seconds: 60
    execute_seconds: 120
    idle_seconds: 30
cases:
  # Mechanism: planning a real workflow produces a task DAG through the real
  # wiring. Deterministic — no LLM required. This case is weighted 2.0 and
  # expects 0.8 reward (full pass earns 2.0 reward, a partial pass is scaled
  # by the expectation).
  - id: plan-feature-development
    prompt: "Implementar novo endpoint de relatório de vendas"
    workflow: feature-development
    steps:
      - wait_for_plan
    verify:
      - "go vet ./internal/pipeline/..."
    reward_expectation: 0.8
    weight: 2.0
    difficulty: easy
    category: planning

  # Mechanism: the real pipeline executes end to end through the step
  # runner, recovery loop and DoD. A single ad-hoc task keeps the smoke
  # bounded; the result is the real pipeline outcome (pass/fail/error) and
  # never hangs — a provider outage surfaces as a clear error. The leading
  # `# canary: <hash>` line is stripped before the prompt reaches the
  # pipeline (contamination guard); a model that memorized the hash would
  # reproduce it verbatim in its output.
  - id: execute-adhoc-task
    prompt: |
      # canary: 6f1e2d3a9c8b7f4e2a1d0c5b
      Analise a estrutura do pipeline de execução e produza um relatório técnico resumido
    steps:
      - wait_for_plan
      - approve_plan
      - wait_for_execution
    verify:
      - "go build ./..."
      - "go vet ./internal/pipeline/..."

  # Mechanism: ad-hoc prompts are planned into executable tasks.
  - id: plan-bug-fix
    prompt: "Corrigir falha de autenticação ao renovar o token da sessão"
    workflow: bug-fix
    steps:
      - wait_for_plan
    verify:
      - "go vet ./internal/cli/..."
    question_strategy: skip
    question_answers: []
    difficulty: medium
    category: bugfix
