# Cosca Project Scaffold Configuration
# Generated by: cosca init
# Purpose: Define project structure, tooling, and agent preferences

project:
  name: ""
  type: ""          # api, web, cli, mobile, library, monorepo
  language: ""      # go, python, typescript, rust
  framework: ""     # nextjs, fastapi, gin, etc.

design:
  design_doc: DESIGN.md
  tokens: packages/brand/theme.css
  design_standard: PADRAO-COSCA.md

structure:
  source_dir: src/
  test_dir: tests/
  docs_dir: docs/
  scripts_dir: scripts/

tooling:
  build: ""
  test: ""
  lint: ""
  format: ""

agents:
  default: cosca-kernel
  allowed: []

knowledge:
  patterns: true
  learnings: true
  auto_evolution: true

security:
  sandbox: true
  jwt_secret_env: COSCA_JWT_SECRET
