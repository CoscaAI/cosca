    - id: conduta-chain-reassinatura
      statement: 'CONDUTA DA CHAIN (2026-08-24, aprendizagem central). Todo commit que tocar internal/embed/cosca/ (o cerebro) EXIGE re-assinar a family chain imediatamente apos: cosca-check --sign-auto. O commit do embed avanca o HEAD mas a chain continua ancorada no commit anterior -> GIT COMMIT MISMATCH -> o serve RECUSA SUBIR (log.Fatal "family chain breach detected - startup blocked"). ISSO E PROTECAO POR DESIGN (fail-closed contra agentes maliciosos), NAO BUG. FATO: derrubei o serve ao commitar o embed (guia + L433 + grafo) sem re-assinar; a chain ficou ancorada em bab096c e o HEAD foi para 6c131a8; o serve caiu. RESOLVIDO: cosca-check --sign-auto gerou Block 23/24 ancorado no HEAD, e o bloqueio de integridade acabou. DIAGNOSTICO: serve nao sobe -> PRIMEIRA suspeita e a chain desalinhada (checar git log -1 vs ultimo bloco), NAO banco/memoria. NUNCA contornar/debilitar o gate de integridade. Ensinado ao kernel antigo via SESSION_PROTOCOL.md (secao 4 reforcada) + DESPERTAR.md (conduta da chain).'
      kind: decision
      source: Don+cosca-kernel
      confidence: 0.98
      created_at: "2026-08-24T00:00:00Z"

    - id: auditoria-integridade-embed-20260824
      statement: 'AUDITORIA DE INTEGRIDADE EMBED (2026-08-24, verificacao somente-leitura a pedido do Don). O Don concedeu acesso de leitura para validar corretamente a preocupacao (levantada pelo proprio kernel): a chain protege o git ou o DISCO? RESULTADO: a chain NAO valida o git - consentChallenge() (internal/cli/memory_identity.go:141) faz filepath.Walk no DIRETORIO FISICO internal/embed/cosca e hasheia cada arquivo do DISCO com BLAKE3 (digest canonico ordenado path:hash:size). Conclusao: a chain valida o DISCO REAL. E como git status --porcelain -- internal/embed/cosca mostra SEM DIFF, o disco = o commit (hash arvore 3a0d2685eda...). Logo: chain valida o mesmo conjunto que o git vincula, e o Bloco 30 (re-assinado com autoridade do Don via --sign) foi assinado SOBRE esse mesmo disco integro. MEDIDO: 2002 arquivos no disco = 2002 git-tracking = 2002 chain files; Chain valid: 30 blocks. CORRECAO DE RACIOCINIO: o kernel havia inferido (errado) que a chain protegia o git e nao o disco; a auditoria provou o contrario (default do lado seguro). NAO TESTADO: conteudo dos 2002 arquivos nao foi criptograficamente comparado ao clone do WSL (escopo homologo, nao um achado). NENHUMA alteracao feita - somente leitura.'
      kind: observed
      source: Don+cosca-kernel
      confidence: 0.95
      created_at: "2026-08-24T00:00:00Z"

    - id: principio-autoria-padrao-cosca
      statement: 'PRINCIPIO DA CASA (2026-08-24, identidade do metodo, ensinado pelo Don). TUDO que construimos juntos foi criado DO ZERO - cada linha de codigo foi escrita por nos, NADA foi copiado. Mas NAO escrevemos no escuro: partimos de ESTUDO DE PADROES DE CODIGO (como os bons resolvem um problema parecido) e entao IMPLEMENTAMOS DO NOSSO JEITO, sempre melhorando sobre o que encontramos. FORMULA: [estudo de padroes externos / benchmark de como os bons fazem] + [autoria 100% nossa, do zero] + [resultado sempre MELHOR que a referencia]. O padrao Cosca NAO e copiar um projeto pronto - o projeto de referencia (ex: HornFit, sistema de OS + contratos academia/condominio) e INSUMO DE ESTUDO, NAO MODELO. Dele extraimos: (1) o que resolveram bem (aprender), (2) o que fizeram mal/desatualizado (melhorar fazendo do nosso jeito), (3) o que e forca a preservar (e o que e divida a corrigir). REGRA: nunca entregar codigo copiado; sempre entregar codigo nosso, mais proveito do benchmark, mais pedacos do padrao Cosca ja consolidado (dominio modular, camada API/backend, banco, testes, qualidade).'
      kind: decision
      source: Don+cosca-kernel
      confidence: 0.99
      created_at: "2026-08-24T00:00:00Z"

    - id: protocolo-github-aquisicao-20260824
      statement: 'PROTOCOLO GITHUB + AQUISICAO (2026-08-24, ensinado pelo Don, materializado como .opencode/cosca/shared/GITHUB_ACQUISITION_PROTOCOL.md). O Don ensinou o metodo de minerar repositorios do GitHub no padrao Cosca: o fluxo e PESQUISAR (github.com/search?q=<termos>&type=repositories&s=stars&o=desc) -> AVALIAR (estrelas>=1k, escopo, manutencao, licenca - GPL/AGPL seria so estudar padrao, NAO derivar codigo; MIT/Apache/BSD ok; propriataria/sem-licenca descartar) -> PROTEGER (cosca security scan de CVE, checagem de malware/backdoor em preinstall/ofuscacao, fail-closed --allow-remote) -> BAIXAR (cosca knowledge add github:<org>/<repo> registra o link de proveniencia + knowledge acquire --allow-remote --compile indexa no FTS5) -> EXPLORAR (clone em TEMP, ler padroes com Glob/Grep, NUNCA copiar) -> ENTENDER (extrair padrao + contra-padrao + melhoria do nosso jeito) -> REGISTRAR (knowledge search ✓ + provenance com repository/commit/sha256, re-semeavel). REGRA DE OURO: NUNCA copiar codigo - o repo e INSUMO DE ESTUDO, NAO MODELO; a casa aprende o padrao e reescreve melhor, com padrao Cosca por cima. CONFIRMADO em pratica: minerei shadcn-ui/ui via add+acquire+compile (Status acquired, Repository shadcn-ui/ui, busca FTS5 ativa com provenance) sem instalar nada no projeto (KNOWLEDGE != DEPENDENCY != CODE).'
      kind: knowledge
      source: Don+cosca-kernel
      confidence: 0.98
