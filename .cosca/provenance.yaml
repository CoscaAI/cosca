    - id: rankeamento-multi-fator
      statement: 'RANKING MULTI-FATOR ATIVADO (2026-08-24, commit 2d47bd6). Fase 2 da campanha de qualidade da busca semantica. O ranker multi-fator ja existia em internal/ranking mas era fiacao morta - nunca rodava no caminho do usuario (cosca knowledge search) porque o LayeredSearch usava sub-queries de fonte unica (gate sourceCount>1 nunca disparava) e a saida era o cosseno cru (ranking achatado 0.67-0.72). BUGFIX CRITICO (causa raiz do score=0): ranking.New(e.cfg.RankingConfig) recebia Config{} zero - New() so aplicava default p/ BM25K/BM25B/FreshnessHalfLife, os PESOS ficavam 0.0 -> score combinado=0. Agora New() aplica pesos default quando zero. Corrigido: ranking.New aplica pesos de DefaultConfig; LayeredSearch ganhou SetRanker()+defer de rerank; rerankResults() propaga score combinado; knowledge.go getter Ranker(); CLI injeta SetRanker(ke.Ranker()). Retrocompativel (ranker nil mantem mergeRanked por score cru). Validado: build limpo, vet limpo, testes internal/ranking+internal/search verdes, score>0 na pratica (0.605/0.602 vs 0 antes).'
