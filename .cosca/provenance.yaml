    - id: cofre-blindagem-executada
      statement: 'BLINDAGEM DO COFRE EXECUTADA (2026-08-24, resolvido). Fundacao provada de ponta a ponta: WSL2 ativado + Ubuntu-24.04 + bwrap 0.9.0 instalado + usuario nao-root (cosca, uid 1000). JAIL bwrap como nao-root funciona (unshare-all + unshare-user + unshare-net). AIR-GAP REAL provado: dentro da jaula SEM-ETH0 (rede totalmente desligada). ELF Linux (GOOS=linux amd64) cross-compila e roda na jaula com COSCA_JAILED=1. ADR-012 (2 zonas) + threat-model-cofre-windows criados. P0-1 CORRIGIDO: opt-in COSCA_ALLOW_NO_ROOT NAO e mais default - removido de cosca-serve.bat, cosca-service.ps1 (2x), deploy/install-service.ps1 (guia NSSM + launcher); fail-closed real (sem opt-in = exit 1), env = escape-hatch explicito nunca default; docs README-WINDOWS sec.4/7/11 atualizados. P0-3 ENTREGUE: comando novo cosca cofre (validate/gate/health) reutiliza internal/oracle (Gate.Evaluate fail-closed); 13 testes verdes; validate produz ACCEPT/ACCEPT_WITH_CAVEAT/REJECT/INCONCLUSIVE com gaps+perguntas; --json p/ Kernel; health reporta air-gap honestamente (Windows host = sem air-gap, WSL2+bwrap = air-gap). DECISAO DE DESIGN: validacao (fase 1) antes de migrar o serve (fase 2) - Cofre dedicado com superficie minima. EXIT CODES: 0=ACCEPT/CAVEAT, 1=REJECT, 2=INCONCLUSIVE. PENDENTE FASE 2: migrar o serve pro Cofre WSL2, blindagem nativa host (AppContainer+Job+Low-IL+firewall, P1), envelope assinado/HMAC, air-gap de egresso do WSL. NOTA: TestCronFullCycle/TestCronRun pre-existentes flaky (cron.go nao tocado); TestRootCommand_HasAllSubcommands corrigido (cofre+world).'
