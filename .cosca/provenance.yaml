    - id: auditoria-confronto-protocolo-github-20260824
      statement: 'AUDITORIA DE CONFRONTO GITHUB_ACQUISITION_PROTOCOL v1.1.0 vs RUNTIME (2026-08-24). REGISTRO DE ESTADO DO SISTEMA - EVIDENCIA, NÃO ORDEM DE ALTERACAO. Nenhuma implementacao foi feita a partir desta auditoria. OBJETIVO: descobrir quanto do v1.1.0 e sustentado pelo runtime, com Código > hipotese, Evidencia > narrativa, Enforcement > intencao, UNKNOWN != PASS, POLICY != FACT. RESULTADO central (VERDICT: SAFE WITH GAPS, viés UNDER-DOCUMENTED na rede + POLICY-HEAVY na governanca): a camada de adquisição/rede (internal/acquisition + internal/knowledge/acquire.go) é bem endurecida (ENFORCEMENT real); a camada de governanca (hierarquia, maquina de estados, 13 gates, PROJECT_WRITE_GATE, KNOWLEDGE_ABSTRACTION_BOUNDARY, EXECUTION_GATE) existe apenas como POLICY, sem enforcement runtime (POLICY_ONLY). MECANISMOS VERIFICADOS COMO ENFORCED (FACT em codigo): SSRF guard (validateTarget acquisition.go, so http/https, bloqueio loopback/RFC1918/link-local/ULA/metadata cloud, anti DNS-rebinding no DialContext); --allow-remote fail-closed (acquire.go:105-107); provenance inicial UNTRUSTED (acquisition.go:220-228); quarentena real (QuarantineArtifact quarantine_integration.go:22 - Proposal Q-XXXX, Source external:<url>, corpo fora do conhecimento); budget tracker (budget.go:86-144 - fontes/arquivos/bytes/tempo/tokens, Exceeded() aborta); verifyGitHubRepo health gate (acquire.go:373-406 - minStars=50, minAge=90d, maxOpenIssues=20000, rejeita archived/fork/sem-licenca - PORÉM só health, NAO malware/scripts/submodule); body truncado a 500 KiB (acquire.go:231). GATES ENFORCED: REMOTE_ACCESS_GATE (--allow-remote + validateTarget), DOWNLOAD_GATE (fetch SSRF-safe). GATES PARTIALLY_ENFORCED: LICENSE_GATE (so checa license.spdx_id do repo raiz, nao por arquivo/heterogeneidade), SECURITY_GATE (verifyGitHubRepo so health, nao malware/scripts/hooks/submodule/symlink/binario - ESTE É O OVER-CLAIM MAIS IMPORTANTE), KNOWLEDGE_GATE (--compile/--embed indexam markdown no FTS5, mas sem barreira de abstracao), PROVENANCE_GATE (grava URL/repo/SHA256/retrievedAt/contentType/size, mas NAO branch/tag/commit/ferramenta/agente). GATES POLICY_ONLY (sem enforcement runtime): RESEARCH_GATE, ISOLATION_GATE, EXECUTION_GATE, EXTRACTION_GATE, KNOWLEDGE_ABSTRACTION_GATE, PROJECT_WRITE_GATE, DEPENDENCY_CHANGE_GATE. ESTADO COM MÁQUINA DE ESTADOS: os estados DISCOVERED->...->KNOWLEDGE_ACCEPTED NAO existem mecanicamente; sao documentacao (POLICY_ONLY). O fluxo real e linear: add -> AcquirePackage -> (verify repo health) -> fetch -> write markdown -> compile FTS5 -> status: acquired. UNKNOWN ≠ PASS é regra textual, nao mecanismo que bloqueie. BYPASS: git clone/curl/wget direto contornam budget/allow-remote/quarentena/verify (UNKNOWN se o agent invoca externamente); --force so ignora health gate (stars/age/issues/license), mantem SSRF/allow-remote (bypass parcial documentado); AllowLoopback=true (default no acquire) enfraquece o SSRF guard ao aceitar loopback/metadata (trade-off jail/container). CONCLUSOES FALSIFICADAS E CORRIGIDAS: (1) --compile/--embed NAO executam o repo - MANTIDO (IndexDirectory indexa markdown no FTS5; a auditoria anterior do professor sugeria o contrario, mas o codigo confirma que nao executa o repo); (2) SECURITY_GATE protege contra malware - REVISTA (verifyGitHubRepo so checa health, nao malware/scripts - OVER-CLAIM); (3) PROJECT_WRITE_GATE impede escrita - REVISTA (POLICY_ONLY, o acquire nao escreve no projeto mas nada no runtime impede um agente de escrever; protecao por design separado, nao enforcement); (4) AllowLoopback=true util - PARCIALMENTE (trade-off compatibility, mas enfraquece SSRF). NOT_IMPLEMENTED (campos que NAO existem no codigo, marcados honestamente no v1.1.0): branch/tag, commit SHA, licenca detectada (por arquivo), arquivos estudados, ferramenta+versao, resultado de scanners, transformacao para abstracao, agente responsavel, decisao+motivo. OVER-CLAIMS (documento promete mais que codigo): SECURITY_GATE como protecao contra scripts do repo (só health), maquina de estados como barreira (sem enforcement), LICENSE_GATE por arquivo (so repo raiz). UNDER-DOCUMENTED (codigo mais forte que doc): verifyGitHubRepo health gate com thresholds exatos, body-truncate 500 KiB, buildAcquireURLWithBranch (main->master fallback), rejeicao de fork/archived. DECISAO REGISTRADA (ordem do professor, respeitada): NENHUMA alteracao decorrente da auditoria. Os gates POLICY_ONLY serao tratados como requisito de implementacao futura, NAO como protecao vigente. Nao implementar EXECUTION_GATE/PROJECT_WRITE_GATE/KNOWLEDGE_ABSTRACTION_BOUNDARY agora - evita misturar mudanca de governanca com o proximo teste (mundo/cidade no Cosca semantico - baseline limpo).'
