version: "1.0"
profile: default
mode: development
verbose: false
paths:
    home: C:\Users\Henrique\.config\cosca
    project: C:\Users\Henrique\Documents\cosca
    runtime: C:\Users\Henrique\.config\cosca\runtime
    data: C:\Users\Henrique\.config\cosca\data
    cache: C:\Users\Henrique\.config\cosca\cache
    logs: C:\Users\Henrique\.config\cosca\logs
    temp: C:\Users\Henrique\.config\cosca\tmp
    plugins: C:\Users\Henrique\.config\cosca\plugins
    backups: C:\Users\Henrique\.config\cosca\backups
db:
    path: C:\Users\Henrique\.config\cosca\cosca.db
    wal_mode: true
    page_size: 4096
    cache_size_kb: 65536
    max_open_conns: 25
    max_idle_conns: 5
    conn_max_lifetime: 30m0s
    conn_max_idle_time: 5m0s
    enable_fts5: true
    enable_vector_ext: false
    backup_interval: 1h0m0s
provider:
    name: ollama
    model: qwen2.5-coder:14b-128k
    context_window: 131072
    api_key: ""
    base_url: ""
    max_tokens: 16384
    temperature: 0.2
    timeout: 30s
    max_retries: 3
    rate_limit_per_min: 60
embedding:
    model: nomic-embed-text
    dimensions: 768
    batch_size: 100
    provider: ollama
    base_url: ""
    api_key: ""
editor:
    name: vim
    theme: default
    font_size: 12
    tab_size: 4
    line_numbers: true
    word_wrap: true
    auto_save: true
    auto_save_interval: 30s
watch:
    enabled: true
    debounce: 100ms
    recursive: true
    exclude_patterns:
        - .git/**
        - node_modules/**
        - '*.log'
        - '*.tmp'
    include_patterns: []
    max_file_size: 10485760
search:
    default_limit: 50
    max_results: 1000
    min_score: 0.7
    enable_vector: true
    enable_fulltext: true
    enable_graph: true
    index_interval: 5s
server:
    host: 127.0.0.1
    api_port: 8370
    metrics_port: 8371
    rpc_port: 8372
    tls: false
    read_timeout: 30s
    write_timeout: 30s
    max_header_bytes: 1048576
log:
    level: info
    format: console
    max_size_mb: 100
    max_backups: 5
    max_age_days: 30
    compress: true
    show_caller: false
cache:
    type: memory
    size: 10000
    ttl: 5m0s
    enable_compression: false
network:
    insecure_skip_verify: false
    dial_timeout: 10s
    keep_alive: 30s
    max_idle_conns: 100
    idle_conn_timeout: 1m30s
    tls_handshake_timeout: 10s
    response_header_timeout: 30s
    expect_continue_timeout: 1s
features:
    metrics: true
    telemetry: true
    auto_update: true
    vector_search: true
    graph_search: true
    file_watching: true
    plugin_system: false
    shell_completion: true
    experimental: false
pipeline:
    enabled: false
    auto_fix: false
plugins:
    enabled: false
    dir: C:\Users\Henrique\.config\cosca\plugins
    allowed_policies:
        - network
        - filesystem
        - exec
    timeout: 30s
    max_memory_mb: 128
performance:
    max_memory_mb: 512
    max_open_files: 1024
    max_concurrent_ops: 10
    batch_size: 100
    worker_pool_size: 16
    prefetch_size: 1024
timeouts:
    command: 30s
    agent: 5m0s
    skill: 2m0s
    workflow: 10m0s
    request: 30s
    graceful_shutdown: 10s
    health_check: 30s
