version: "1.0"
profile: default
mode: development
verbose: false
paths:
    home: C:\Users\Henrique\.config\cosca
    project: C:\Users\Henrique\Documents\cosca
    runtime: C:\Users\Henrique\.config\cosca\runtime
    data: C:\Users\Henrique\.config\cosca\data
    cache: C:\Users\Henrique\.config\cosca\cache
    logs: C:\Users\Henrique\.config\cosca\logs
    temp: C:\Users\Henrique\.config\cosca\tmp
    plugins: C:\Users\Henrique\.config\cosca\plugins
    backups: C:\Users\Henrique\.config\cosca\backups
db:
    path: C:\Users\Henrique\.config\cosca\cosca.db
    wal_mode: true
    page_size: 4096
    cache_size_kb: 65536
    max_open_conns: 25
    max_idle_conns: 5
    conn_max_lifetime: 30m0s
    conn_max_idle_time: 5m0s
    enable_fts5: true
    enable_vector_ext: false
    backup_interval: 1h0m0s
provider:
    name: ollama
    model: cosca-qwen3-4b-lora-001:latest
    context_window: 131072
    api_key: ""
    base_url: http://localhost:11434
    max_tokens: 16384
    temperature: 0.8
    timeout: 30s
    max_retries: 3
    rate_limit_per_min: 60
embedding:
    model: nomic-embed-text
    dimensions: 768
    batch_size: 100
    provider: ollama
    base_url: ""
    api_key: ""
editor:
    name: vim
    theme: default
    font_size: 12
    tab_size: 4
    line_numbers: true
    word_wrap: true
    auto_save: true
    auto_save_interval: 30s
watch:
    enabled: true
    debounce: 100ms
    recursive: true
    exclude_patterns:
        - .git/**
        - node_modules/**
        - '*.log'
        - '*.tmp'
    include_patterns: []
    max_file_size: 10485760
search:
    mode: legacy
    default_limit: 50
    max_results: 1000
    min_score: 0.3
    enable_vector: true
    enable_fulltext: true
    enable_graph: true
    index_interval: 5s
server:
    host: 127.0.0.1
    api_port: 8370
    metrics_port: 8371
    rpc_port: 8372
    tls: false
    read_timeout: 30s
    write_timeout: 30s
    max_header_bytes: 1048576
log:
    level: info
    format: console
    max_size_mb: 100
    max_backups: 5
    max_age_days: 30
    compress: true
    show_caller: false
cache:
    type: memory
    size: 10000
    ttl: 5m0s
    enable_compression: false
network:
    insecure_skip_verify: false
    dial_timeout: 10s
    keep_alive: 30s
    max_idle_conns: 100
    idle_conn_timeout: 1m30s
    tls_handshake_timeout: 10s
    response_header_timeout: 30s
    expect_continue_timeout: 1s
features:
    metrics: true
    telemetry: true
    auto_update: true
    vector_search: true
    graph_search: true
    file_watching: true
    plugin_system: false
    shell_completion: true
    experimental: false
vision:
    enabled: false
perception:
    enabled: false
    mode: normal
    interval: 2s
    max_interval: 30s
    capture: screen
    change_detection:
        enabled: true
        threshold: 0.02
    audio:
        enabled: false
        window: 5s
        tolerance: 300ms
        sample_rate: 16000
        chunk_ms: 100
        stt:
            provider: sherpa
            model_dir: C:\Users\Henrique\.cosca\models\stt-zipformer-pt-kroko
            model_type: transducer
            sample_rate: 16000
            num_threads: 2
            device: cpu
            decoding_method: greedy_search
            enable_endpoint: true
            max_segment_duration: 30s
        mic:
            enabled: true
            device: 0
            sample_rate: 16000
            channels: 1
            chunk_ms: 100
        tts:
            provider: sherpa
            model_dir: C:\Users\Henrique\.cosca\models\tts-vits-piper-pt_BR-edresson-low
            model_type: vits
            sample_rate: 16000
            num_threads: 2
            device: cpu
            speed: 1
            sid: 0
    episodic:
        enabled: false
        ttl: 720h0m0s
        max_records: 5000
    knowledge_cache: true
pipeline:
    enabled: false
    auto_fix: false
orchestration:
    deliberation:
        enabled: false
        shadow_mode: true
        emit_threshold: 0.7
        reservation_threshold: 0.5
        max_evidence: 5
        max_chars_per_evidence: 300
        min_score: 0.5
plugins:
    enabled: false
    dir: C:\Users\Henrique\.config\cosca\plugins
    allowed_policies:
        - network
        - filesystem
        - exec
    timeout: 30s
    max_memory_mb: 128
performance:
    max_memory_mb: 512
    max_open_files: 1024
    max_concurrent_ops: 10
    batch_size: 100
    worker_pool_size: 16
    prefetch_size: 1024
timeouts:
    command: 30s
    agent: 5m0s
    skill: 2m0s
    workflow: 10m0s
    request: 30s
    graceful_shutdown: 10s
    health_check: 30s
