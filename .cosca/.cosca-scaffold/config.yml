# Cosca Project Configuration
# Generated by Cosca Template Engine — customize for your project
#
# This file defines project-level Cosca settings.
# Global Cosca settings are in ~/.config/opencode/opencode.jsonc

# Version: 1.0.0

project:
  name: "Cosca"
  type: "saas"
  description: "AI Orchestration System Enterprise Platform"
  created: "2026-07-10"

# Technology stack (auto-discovered or from template)
# Override if auto-discovery is incorrect
tech_stack:
  language: "go"
  framework: "net/http + Cobra"
  database: "sqlite"
  cache: "in-memory"
  orm: "none (raw SQL)"
  queue: "none"

# Quality targets (must meet or exceed these)
quality:
  test_coverage_min: 80        # percentage
  complexity_max: 10           # cyclomatic
  function_lines_max: 70
  file_lines_max: 400
  duplication_max: 5           # percentage
  dependency_vuln_max: 0       # critical/high allowed

# Workflow preferences
workflows:
  default_review_required: true
  default_qa_required: true
  default_documentation_required: true
  auto_merge_on_approval: false
  parallel_execution_enabled: true
  max_parallel_tasks: 10

# Agent preferences
agents:
  preferred_model: null        # Override per-project model
  preferred_small_model: null  # Override for simple tasks
  chief_temperature: 0.4
  specialist_temperature: 0.3
  creative_temperature: 0.8

# Memory settings
memory:
  auto_capture_decisions: true
  auto_capture_bugs: true
  auto_capture_patterns: true
  prune_after_days: 90

# Documentation
documentation:
  auto_update_readme: true
  auto_update_changelog: true
  auto_generate_api_docs: true
  adr_directory: "docs/ADR/"

# Environments (for deployment workflows)
environments:
  development:
    branch: "develop"
    auto_deploy: false
  staging:
    branch: "staging"
    auto_deploy: true
  production:
    branch: "main"
    auto_deploy: false
    require_approval: true
