# heuristics/H-018-confidence-theatre.yaml
id: H-018
title: "Confidence theatre: métricas que incentivam reportar sucesso em vez de melhoria real"
domain: orchestration
type: anti-pattern
severity: high
source_agents: [cosca-critic, cosca-kernel, cosca-ceo, cosca-governance]
description: >
  O modelo de confiança da plataforma (confidence ≥ 0.40 por tarefa) incentiva
  agentes a reportar sucesso mesmo quando a qualidade é duvidosa. O critic
  identificou que o architecture do plano Onda 2 "incentivizes reporting success
  over actual improvement" — a métrica é gamificada se o gate é "1 task completed"
  sem validação de qualidade. 94% dos agentes têm zero failure records — mas
  não porque nunca falham, e sim porque falhas não são registradas. O CEO
  confirmou: "CIS 84-86 is aspirational — no real calibration data exists."
evidence:
  - "2026-07-28: Critic agent — 'Confidence theatre is the dominant long-term risk: the architecture incentivizes reporting success over actual improvement'"
  - "2026-07-28: Semantic-memory — 'Only 3 of 55 agents have recorded failures — negative memory is severely underutilized'"
  - "2026-07-28: CEO — 'CIS 84-86 is aspirational — no real calibration data exists'"
  - "2026-07-28: Critic — 'The metric (confidence ≥ 0.40) is gamed if the gate is 1 task completed without quality validation'"
  - "2026-07-28: Technical-debt — 75 debt items cataloged despite 'healthy' metrics"
action: "Todo registro de task completion deve incluir evidência verificável (não apenas auto-report). Confidence score deve integrar cross-agent validation (M2 modifier). Failure records devem ser incentivados como aprendizado, não punidos. Métricas devem medir qualidade, não quantidade."
related: [H-007, H-008, H-010, H-019]
tags: [orchestration, confidence, metrics, theatre, gamification, quality-validation, anti-pattern]
confidence: 0.85
created: 2026-07-29
