# heuristics/H-019-negative-memory-underutilized.yaml
id: H-019
title: "Memória negativa é o recurso de aprendizado mais valioso e mais subutilizado"
domain: memory
type: anti-pattern
severity: high
source_agents: [cosca-semantic-memory, cosca-critic, cosca-kernel, cosca-ceo]
description: >
  Apenas 3 de 55 agentes registraram falhas. O semantic-memory identificou que
  "negative memory is severely underutilized despite being the most valuable
  learning resource per the AUTO_EVOLUTION protocol." O critic demonstrou que
  cross-reference de bug registry + semantic index revela inconsistências
  invisíveis em single-source analysis. O padrão "avoided failures" do
  cosca-backend (que usou memória negativa passada para evitar 2 falhas) é
  exemplar e deveria ser replicado. Sem memória negativa, o sistema repete
  os mesmos erros porque não aprende com eles.
evidence:
  - "2026-07-28: Semantic-memory — 'Only 3 of 55 agents have recorded failures — negative memory is severely underutilized'"
  - "2026-07-28: Semantic-memory — 'The avoided failures pattern (cosca-backend — 2 avoided failures from past negative memory) is exemplary'"
  - "2026-07-28: Critic — 'Cross-reference is the critic's superpower — finding inconsistencies invisible to single-source analysis'"
  - "2026-07-28: CEO — '94% of agents have zero failure records. This is not because they never fail.'"
  - "2026-07-28: Performance agent — Benchmark failure on FTS5 exposed critical schema bug that 'would otherwise remain hidden'"
action: "Incentivar registro de falhas como learning opportunity. Todo agente deve ter failures.md populado com falhas reais. Criar cross-agent feedback loop: 'show me failures related to X across all agents.' Falhas que geram aprendizado devem ser valorizadas, não escondidas."
related: [H-010, H-018, H-012]
tags: [memory, negative-memory, failures, learning, cross-agent, anti-pattern, underutilization]
