# heuristics/H-013-architecture-code-gap.yaml
id: H-013
title: "Arquitetura documentada vs implementada: verificar código antes de confiar na doc"
domain: governance
type: anti-pattern
severity: critical
source_agents: [cosca-provider, cosca-platform, cosca-critic, cosca-kernel]
description: >
  Documentos de arquitetura descrevem features que nunca foram implementadas
  no código. PROVIDER_INTERFACE.md define circuit breaker (3-state, thresholds),
  multi-provider failover (3-tier chain), e cost tracking — nenhum existe.
  Documentação de coverage declara 80%+ mas CI executa 55%. O semantic index
  lista capacidades que são aspirational. Pattern: documento de arquitetura
  vira "wishlist" em vez de "spec". A arquitetura documentada deve ser
  auditada contra o código real periodicamente.
evidence:
  - "2026-07-28: Provider agent — 'PROVIDER_INTERFACE.md §2.3 defines circuit breaker. Zero implementation exists in code.'"
  - "2026-07-28: Provider agent — 'PROVIDER_INTERFACE.md §2.2 defines failover chain. No provider chain, no failover logic.'"
  - "2026-07-28: Platform agent — gap correlation: 'Circuit breaker and failover are documented but not implemented'"
  - "2026-07-28: Critic — 'Foundational document inconsistency is a critical risk vector'"
  - "2026-07-28: Kernel L3 — 'always verify memory against go.mod + source code'"
action: "Auditar documentos de arquitetura contra implementação real a cada sprint. Features documentadas mas não implementadas devem ser marcadas como [PLANNED] ou [ASPIRATIONAL] no doc. Não remover do doc (serve como roadmap) — mas nunca deixar sem marcação."
related: [H-009, H-011, H-012]
tags: [governance, architecture, documentation, implementation-gap, circuit-breaker, failover, anti-pattern]
confidence: 0.90
created: 2026-07-29
