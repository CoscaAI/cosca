# heuristics/H-014-n-plus-one-queries.yaml
id: H-014
title: "N+1 roundtrips em queries sequenciais matam performance mesmo com queries rápidas"
domain: performance
type: anti-pattern
severity: high
source_agents: [cosca-performance, cosca-cache]
description: >
  Mesmo queries individuais extremamente rápidas (<3µs cada) causam latência
  perceptível quando executadas sequencialmente sem caching. GetStats() faz
  6 queries SQL sequenciais + graph serialization + os.Stat() — cada query é
  O(1µs) mas o total é dominado pelo overhead de roundtrip. O Sync() tem
  o mesmo problema: carrega todos os paths de documentos e verifica existência
  individualmente no filesystem. O cache engine multi-tier existia mas não
  estava integrado ao search path — 40 LOC de wire-up resultou em 64x speedup.
evidence:
  - "2026-07-28: Performance agent — 'GetStats(): 6 sequential DB queries + graph serialization + os.Stat(). No caching between calls.'"
  - "2026-07-28: Performance agent — 'Sync() loads all document paths, then checks filesystem existence individually'"
  - "2026-07-28: Cache agent — 'KnowledgeEngine.Search() goes straight to FTS5+vector without any cache lookup'"
  - "2026-07-28: Cache agent — '20 lines of code in knowledge.go would reduce vector search latency from 64ms to <1ms (~64x)'"
action: "Para qualquer função que execute 3+ queries sequenciais: (1) adicionar cache com TTL, (2) agrupar queries quando possível, (3) invalidar cache em eventos de rebuild/index. Medir antes/depois com benchmark."
related: [H-015, H-004]
tags: [performance, n-plus-one, caching, sqlite, roundtrip, optimization, anti-pattern]
confidence: 0.85
created: 2026-07-29
