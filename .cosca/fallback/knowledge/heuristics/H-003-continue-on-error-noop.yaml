# heuristics/H-003-continue-on-error-noop.yaml
id: H-003
title: "continue-on-error: true torna qualquer gate de CI inoperante"
domain: ci-cd
type: anti-pattern
severity: critical
source_agents: [cosca-kernel, cosca-review, cosca-devops]
description: >
  O flag `continue-on-error: true` em um step de GitHub Actions permite que o
  pipeline continue mesmo quando o gate falha. Isso transforma qualquer quality
  gate em um no-op silencioso — o CI fica verde enquanto violações passam
  despercebidas. O coverage gate original do Cosca tinha `continue-on-error: true`
  com threshold de 55%, e a cobertura real poderia cair para 40% sem alarme.
evidence:
  - "2026-07-28: Kernel L9 — 'Coverage gate no-op: continue-on-error: true — ajustado threshold para 55% baseline real com continue-on-error: false'"
  - "2026-07-28: Review agent — 'CI pipelines devem ser testados quanto ao enforcement real dos gates — continue-on-error: true torna um gate inútil'"
  - "2026-07-29: Coverage audit — Confirmação de que o gate não bloqueava PRs abaixo do threshold"
action: "Todo gate de qualidade no CI deve usar continue-on-error: false. Se um gate precisa ser flexível, ajustar o threshold, não desabilitar o enforcement. Documentar razões de qualquer exceção temporária com data de expiração."
related: [H-002, H-011, H-017]
tags: [ci-cd, github-actions, quality-gates, continue-on-error, anti-pattern, enforcement]
confidence: 0.92
created: 2026-07-29
