# heuristics/H-007-three-wave-orchestration.yaml
id: H-007
title: "Three-wave orchestration: analítico → implementação → revisão"
domain: orchestration
type: pattern
severity: high
source_agents: [cosca-kernel, cosca-critic, cosca-ceo]
description: >
  Padrão de ativação em três ondas sequenciais maximiza qualidade e minimiza
  retrabalho: Onda A (analítica: define standards, quality gates, architecture),
  Onda B (implementação: constrói com os standards definidos), Onda C
  (revisão: valida contra os standards). Aplicado com sucesso na Onda 2
  (10 agentes) e replicado em auditorias de cobertura. O critic identificou
  que ondas sequenciais podem criar viés de confirmação estrutural — a
  mitigação é cross-reference com fontes externas entre ondas.
evidence:
  - "2026-07-28: Kernel L6 — 'Three-wave pattern effective: analytical first (define standards) → implementation second (build with standards) → review third (validate)'"
  - "2026-07-28: Onda 2 — 10 agentes em 3 ondas (5+3+2), 20+ new files, 34 benchmarks, 29 integration tests"
  - "2026-07-28: Critic agent — 'Confirmation bias is structural in sequential waves — not accidental'"
  - "2026-07-29: Kernel L19 — Padrão de auditoria consolidado: 'Audit → delegar em paralelo (discovery + QA + testing) → extrair funções → testar → verificar cobertura'"
action: "Para ativação ou auditoria de larga escala: Onda A (analítica) → Onda B (implementação) → Onda C (revisão). Mitigar viés estrutural com cross-reference de fontes externas entre ondas. Delegar agentes em paralelo dentro de cada onda."
related: [H-008, H-018]
tags: [orchestration, three-wave, activation, parallel-delegation, quality-gates, pattern]
confidence: 0.85
