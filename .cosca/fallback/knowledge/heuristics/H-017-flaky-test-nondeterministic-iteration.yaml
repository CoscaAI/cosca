# heuristics/H-017-flaky-test-nondeterministic-iteration.yaml
id: H-017
title: "Flaky test por iteração não-determinística: Go map range + acesso posicional"
domain: ci-cd
type: anti-pattern
severity: high
source_agents: [cosca-kernel, cosca-review, cosca-testing, cosca-qa]
description: >
  Iteração sobre Go maps (`range`) não é determinística — a ordem dos elementos
  varia entre execuções. Testes que acessam resultados por posição (índice [0],
  [1]) sobre outputs de range em map quebram intermitentemente. O TestChunkBatch
  falhava ~20% das vezes porque usava acesso posicional sobre resultado de
  `range` em `map[string]ChunkResult`. O fix é buscar por ID/chave em vez de
  índice. Detecção de flakiness requer loop de 10+ execuções; 1 falha confirma.
  Review deve exigir -race em todo PR e detectar padrões de acesso posicional
  sobre coleções não-ordenadas.
evidence:
  - "2026-07-28: Kernel L9 — 'Flaky test root cause: Go map iteration não determinística — TestChunkBatch usava acesso posicional sobre resultado de range em map'"
  - "2026-07-28: Kernel L9 — 'Fix: busca por ID'"
  - "2026-07-28: Review agent — 'Flakiness detection: loop de 10+ execuções é necessário; 1 falha já confirma'"
  - "2026-07-28: QA agent — 'flaky test detection (>1 falha em 10 runs = flaky)'"
action: "Proibir acesso posicional (índice [0], [1]) sobre resultados de range em map. Buscar sempre por chave/ID. Adicionar detector de flakiness no CI: 10 execuções com -race; 1 falha = block. Adicionar linter rule para padrão range+posicional."
related: [H-003, H-016]
tags: [ci-cd, flaky-test, golang, map-iteration, nondeterministic, race-condition, anti-pattern]
confidence: 0.90
created: 2026-07-29
