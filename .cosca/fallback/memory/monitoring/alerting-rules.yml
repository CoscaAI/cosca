# Alerting Rules — Cosca v1.4.0-dev
#
# Prometheus-compatible alerting rules (promtool check rule_files pass).
# Designed for use with prometheus-operator or raw Prometheus server.
#
# Owner: cosca-monitoring (Monitoring Chief)
# Version: 1.0.0
# Date: 2026-07-28

groups:
  # ===========================================================================
  # GROUP 1: SLO Alerts — Latency
  # ===========================================================================
  - name: cosca_slo_latency
    interval: 30s
    rules:
      # -----------------------------------------------------------------------
      # SLO #1 — Agent Task Routing Latency
      # -----------------------------------------------------------------------
      - alert: TaskRoutingLatencyHigh
        expr: |
          (
            histogram_quantile(0.95, rate(cosca_task_duration_seconds_bucket{status="dispatched"}[5m]))
            > 0.5
          )
        for: 5m
        labels:
          severity: warning
          slo: "slo-1-agent-task-routing"
          target: "p95 < 500ms"
        annotations:
          summary: "Task routing p95 latency > 500ms for 5 minutes"
          description: >
            Agent task routing latency is {{ $value | humanizeDuration }} (p95),
            exceeding the SLO target of 500ms.
            Check runtime status at GET /v1/status and agent availability at GET /v1/agents.
          runbook_url: "https://github.com/CoscaAI/cosca/blob/main/internal/embed/cosca/memory/monitoring/slos.md#runbook--slo-violation"

      - alert: TaskRoutingLatencyCritical
        expr: |
          (
            histogram_quantile(0.95, rate(cosca_task_duration_seconds_bucket{status="dispatched"}[10m]))
            > 1.0
          )
        for: 10m
        labels:
          severity: critical
          slo: "slo-1-agent-task-routing"
          target: "p95 < 500ms"
        annotations:
          summary: "Task routing p95 latency > 1s (2x baseline) for 10 minutes"
          description: >
            Agent task routing latency is {{ $value | humanizeDuration }} (p95),
            exceeding 2x the SLO target. Immediate investigation required.
          runbook_url: "https://github.com/CoscaAI/cosca/blob/main/internal/embed/cosca/memory/monitoring/slos.md#runbook--slo-violation"

      # -----------------------------------------------------------------------
      # SLO #2 — Knowledge Search Latency
      # -----------------------------------------------------------------------
      - alert: SearchLatencyHigh
        expr: |
          cosca_runtime_duration_seconds{operation="search",quantile="0.95"} > 0.200
        for: 10m
        labels:
          severity: warning
          slo: "slo-2-knowledge-search"
          target: "p95 < 200ms"
        annotations:
          summary: "Knowledge search p95 latency > 200ms for 10 minutes"
          description: >
            Search latency p95 is {{ $value | humanizeDuration }},
            exceeding the SLO target of 200ms.
            Check vector count (cosca_knowledge_vectors_total), cache hit rate, and embedding provider.
          runbook_url: "https://github.com/CoscaAI/cosca/blob/main/internal/embed/cosca/memory/monitoring/slos.md#runbook--slo-violation-1"

      - alert: SearchLatencyCritical
        expr: |
          cosca_runtime_duration_seconds{operation="search",quantile="0.95"} > 0.500
        for: 10m
        labels:
          severity: critical
          slo: "slo-2-knowledge-search"
          target: "p95 < 200ms"
        annotations:
          summary: "Knowledge search p95 latency > 500ms (2.5x baseline) for 10 minutes"
          description: >
            Search latency is critically high at {{ $value | humanizeDuration }} (p95).
            Possible vector store degradation — check for brute-force scan at high vector counts.
          runbook_url: "https://github.com/CoscaAI/cosca/blob/main/internal/embed/cosca/memory/monitoring/slos.md#runbook--slo-violation-1"

      # -----------------------------------------------------------------------
      # SLO #3 — Session Bootstrap Latency
      # -----------------------------------------------------------------------
      - alert: SessionBootstrapSlow
        expr: |
          histogram_quantile(0.95, rate(cosca_session_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
          slo: "slo-3-session-bootstrap"
          target: "p95 < 5s"
        annotations:
          summary: "Session bootstrap p95 latency > 5s for 5 minutes"
          description: >
            Session bootstrap is taking {{ $value | humanizeDuration }} (p95),
            exceeding the SLO target of 5 seconds.
            Check provider connectivity (Phase 2) and SQLite WAL size.
          runbook_url: "https://github.com/CoscaAI/cosca/blob/main/internal/embed/cosca/memory/monitoring/slos.md#runbook--slo-violation-2"

      - alert: SessionBootstrapCritical
        expr: |
          histogram_quantile(0.95, rate(cosca_session_duration_seconds_bucket[10m])) > 15
        for: 10m
        labels:
          severity: critical
          slo: "slo-3-session-bootstrap"
          target: "p95 < 5s"
        annotations:
          summary: "Session bootstrap p95 latency > 15s (3x baseline) for 10 minutes"
          description: >
            Session bootstrap is critically slow at {{ $value | humanizeDuration }} (p95).
            Likely provider timeout or filesystem issue. Check COSCA_PROVIDER config.
          runbook_url: "https://github.com/CoscaAI/cosca/blob/main/internal/embed/cosca/memory/monitoring/slos.md#runbook--slo-violation-2"

      # -----------------------------------------------------------------------
      # SLO #4 — API Response Latency
      # -----------------------------------------------------------------------
      - alert: APILatencyHigh
        expr: |
          (
            sum by (path) (
              rate(cosca_http_request_duration_seconds_sum{path!~"/v1/knowledge/search|/v1/run|/v1/ws"}[5m])
            )
            /
            sum by (path) (
              rate(cosca_http_request_duration_seconds_count{path!~"/v1/knowledge/search|/v1/run|/v1/ws"}[5m])
            )
          ) > 0.100
        for: 5m
        labels:
          severity: warning
          slo: "slo-4-api-response"
          target: "p95 < 100ms"
        annotations:
          summary: "API response latency > 100ms for 5 minutes on {{ $labels.path }}"
          description: >
            Endpoint {{ $labels.path }} is averaging {{ $value | humanizeDuration }},
            exceeding the SLO target of 100ms.
            Check middleware chain (auth, CSRF), GC pauses, and request volume.
          runbook_url: "https://github.com/CoscaAI/cosca/blob/main/internal/embed/cosca/memory/monitoring/slos.md#runbook--slo-violation-3"

      - alert: APILatencyCritical
        expr: |
          (
            sum by (path) (
              rate(cosca_http_request_duration_seconds_sum{path!~"/v1/knowledge/search|/v1/run|/v1/ws"}[10m])
            )
            /
            sum by (path) (
              rate(cosca_http_request_duration_seconds_count{path!~"/v1/knowledge/search|/v1/run|/v1/ws"}[10m])
            )
          ) > 0.300
        for: 10m
        labels:
          severity: critical
          slo: "slo-4-api-response"
          target: "p95 < 100ms"
        annotations:
          summary: "API response latency > 300ms (3x baseline) on {{ $labels.path }}"
          description: >
            Endpoint {{ $labels.path }} is critically slow at {{ $value | humanizeDuration }}.
            Investigate immediately — check for GC storms, memory leaks, or middleware failures.
          runbook_url: "https://github.com/CoscaAI/cosca/blob/main/internal/embed/cosca/memory/monitoring/slos.md#runbook--slo-violation-3"

      # -----------------------------------------------------------------------
      # SLO #5 — Memory Retrieval Latency
      # -----------------------------------------------------------------------
      - alert: MemoryRetrievalLatencyHigh
        expr: |
          cosca_runtime_duration_seconds{operation="memory",quantile="0.95"} > 0.050
        for: 10m
        labels:
          severity: warning
          slo: "slo-5-memory-retrieval"
          target: "p95 < 50ms"
        annotations:
          summary: "Memory retrieval p95 latency > 50ms for 10 minutes"
          description: >
            Memory retrieval p95 latency is {{ $value | humanizeDuration }},
            exceeding the SLO target of 50ms.
            Check memory records volume, per-layer sizes, and filesystem I/O.
          runbook_url: "https://github.com/CoscaAI/cosca/blob/main/internal/embed/cosca/memory/monitoring/slos.md#runbook--slo-violation-4"

      - alert: MemoryRetrievalLatencyCritical
        expr: |
          cosca_runtime_duration_seconds{operation="memory",quantile="0.95"} > 0.150
        for: 10m
        labels:
          severity: critical
          slo: "slo-5-memory-retrieval"
          target: "p95 < 50ms"
        annotations:
          summary: "Memory retrieval p95 latency > 150ms (3x baseline) for 10 minutes"
          description: >
            Memory retrieval is critically slow at {{ $value | humanizeDuration }} (p95).
            Possible filesystem issue or excessive record count in a single layer.
          runbook_url: "https://github.com/CoscaAI/cosca/blob/main/internal/embed/cosca/memory/monitoring/slos.md#runbook--slo-violation-4"

  # ===========================================================================
  # GROUP 2: Error Rate Alerts
  # ===========================================================================
  - name: cosca_error_rates
    interval: 30s
    rules:
      # -----------------------------------------------------------------------
      # HTTP Error Rate
      # -----------------------------------------------------------------------
      - alert: HTTPErrorRateHigh
        expr: |
          (
            sum(rate(cosca_http_requests_total{status_code=~"5.."}[5m]))
            /
            sum(rate(cosca_http_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          category: errors
        annotations:
          summary: "HTTP 5xx error rate > 5% for 5 minutes"
          description: >
            HTTP error rate is {{ $value | humanizePercentage }},
            exceeding the 5% threshold.
            Check runtime health (cosca_runtime_health) and component health status.
          runbook_url: "https://github.com/CoscaAI/cosca/blob/main/internal/embed/cosca/memory/monitoring/slos.md"

      - alert: HTTPErrorRateCritical
        expr: |
          (
            sum(rate(cosca_http_requests_total{status_code=~"5.."}[10m]))
            /
            sum(rate(cosca_http_requests_total[10m]))
          ) > 0.10
        for: 10m
        labels:
          severity: critical
          category: errors
        annotations:
          summary: "HTTP 5xx error rate > 10% for 10 minutes"
          description: >
            HTTP error rate is critically high at {{ $value | humanizePercentage }}.
            Immediate investigation required — check all subsystem health.

      # -----------------------------------------------------------------------
      # gRPC Error Rate
      # -----------------------------------------------------------------------
      - alert: GRPCErrorRateHigh
        expr: |
          (
            sum(rate(cosca_grpc_requests_total{code!~"OK|NotFound|InvalidArgument|Unauthenticated"}[5m]))
            /
            sum(rate(cosca_grpc_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          category: errors
        annotations:
          summary: "gRPC error rate > 5% for 5 minutes"
          description: >
            gRPC error rate is {{ $value | humanizePercentage }},
            excluding expected client errors (NotFound, InvalidArgument, Unauthenticated).

      # -----------------------------------------------------------------------
      # Runtime Operation Errors
      # -----------------------------------------------------------------------
      - alert: RuntimeErrorSpike
        expr: |
          rate(cosca_runtime_operations_total{operation="error"}[5m]) > 10
        for: 5m
        labels:
          severity: warning
          category: errors
        annotations:
          summary: "Runtime error rate spike: > 10 errors/min for 5 minutes"
          description: >
            Runtime is generating {{ $value | humanize }} errors per second.
            Check logs and component health status for failing subsystems.

  # ===========================================================================
  # GROUP 3: Health & Availability Alerts
  # ===========================================================================
  - name: cosca_health
    interval: 30s
    rules:
      # -----------------------------------------------------------------------
      # Runtime Health
      # -----------------------------------------------------------------------
      - alert: RuntimeUnhealthy
        expr: |
          cosca_runtime_health == 0
        for: 2m
        labels:
          severity: critical
          category: health
        annotations:
          summary: "Cosca runtime is unhealthy for 2 minutes"
          description: >
            Runtime health check returned unhealthy.
            Check GET /v1/status for detailed subsystem health.
            Component health: check cosca_runtime_component_health.

      # -----------------------------------------------------------------------
      # Component Health
      # -----------------------------------------------------------------------
      - alert: ComponentUnhealthy
        expr: |
          cosca_runtime_component_health == 0
        for: 5m
        labels:
          severity: warning
          category: health
        annotations:
          summary: "Component {{ $labels.component }} is unhealthy for 5 minutes"
          description: >
            Component {{ $labels.component }} health check failed.
            Check the component's initialization and connectivity.

      # -----------------------------------------------------------------------
      # Metrics Endpoint Down
      # -----------------------------------------------------------------------
      - alert: MetricsEndpointDown
        expr: |
          up{job="cosca-metrics"} == 0
        for: 2m
        labels:
          severity: critical
          category: health
        annotations:
          summary: "Cosca metrics endpoint is down (port 14121)"
          description: >
            Prometheus cannot scrape the /metrics endpoint.
            Check if the cosca serve process is running and port 14121 is reachable.

  # ===========================================================================
  # GROUP 4: Resource & Performance Alerts
  # ===========================================================================
  - name: cosca_resources
    interval: 30s
    rules:
      # -----------------------------------------------------------------------
      # High Memory Usage
      # -----------------------------------------------------------------------
      - alert: HighMemoryUsage
        expr: |
          cosca_process_memory_alloc_bytes / cosca_process_memory_sys_bytes > 0.90
        for: 10m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "Memory usage > 90% of system-allocated memory for 10 minutes"
          description: >
            Heap memory ({{ $value | humanizePercentage }} of system memory) is high.
            Check cosca_process_gc_total for GC frequency.
            Possible memory leak — see bug-004 pattern (provider instance caching).

      # -----------------------------------------------------------------------
      # GC Pressure
      # -----------------------------------------------------------------------
      - alert: GCPressure
        expr: |
          rate(cosca_process_gc_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "High GC frequency: > 10 GC cycles/5min"
          description: >
            GC is running {{ $value | humanize }} times per second on average.
            Check cosca_process_memory_alloc_bytes for heap pressure.
            Vector search at high vector counts (10K+) can cause 46.8MB allocations per query.

      # -----------------------------------------------------------------------
      # Goroutine Leak
      # -----------------------------------------------------------------------
      - alert: GoroutineLeak
        expr: |
          cosca_process_goroutines > 10000
        for: 10m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "Goroutine count > 10,000 for 10 minutes"
          description: >
            Goroutine count is {{ $value }}, indicating a possible goroutine leak.
            Check cosca_runtime_goroutines for the runtime-tracked count.

  # ===========================================================================
  # GROUP 5: Business Logic Alerts
  # ===========================================================================
  - name: cosca_business
    interval: 60s
    rules:
      # -----------------------------------------------------------------------
      # Agent Confidence Drop
      # -----------------------------------------------------------------------
      - alert: AgentConfidenceDrop
        expr: |
          (
            cosca_agent_confidence offset 10m
            -
            cosca_agent_confidence
          ) > 0.20
        for: 10m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "Agent {{ $labels.agent }} confidence dropped > 0.20 in domain {{ $labels.domain }}"
          description: >
            Agent {{ $labels.agent }} confidence in domain {{ $labels.domain }}
            dropped from {{ with query "cosca_agent_confidence offset 10m" }}{{ . | first | value | printf "%.2f" }}{{ end }}
            to {{ $value | printf "%.2f" }}.
            This may indicate model degradation, data drift, or incorrect learnings.

      # -----------------------------------------------------------------------
      # Memory Decay Rate High
      # -----------------------------------------------------------------------
      - alert: MemoryDecayRateHigh
        expr: |
          cosca_memory_decay_rate > 0.10
        for: 15m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "Memory decay rate > 10% per cycle in layer {{ $labels.layer }}"
          description: >
            Memory layer {{ $labels.layer }} is decaying at {{ $value | humanizePercentage }} per cycle.
            This exceeds the acceptable decay rate of 10%/cycle.
            Check curation logic and record quality scores.

      # -----------------------------------------------------------------------
      # Zero Task Throughput
      # -----------------------------------------------------------------------
      - alert: ZeroTaskThroughput
        expr: |
          rate(cosca_tasks_total[10m]) == 0
        for: 10m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "Zero tasks processed in the last 10 minutes"
          description: >
            No tasks have been processed in the last 10 minutes.
            This may be normal (idle period) or indicate a blocked task queue.
            Check runtime state and agent availability.

  # ===========================================================================
  # GROUP 6: Error Budget Burn Rate Alerts
  # ===========================================================================
  - name: cosca_error_budget
    interval: 60s
    rules:
      # -----------------------------------------------------------------------
      # High Burn Rate — SLO #4 (API Response, highest sensitivity)
      # -----------------------------------------------------------------------
      - alert: ErrorBudgetBurnHigh
        expr: |
          (
            sum(rate(cosca_http_requests_total{status_code=~"5.."}[1h]))
            /
            sum(rate(cosca_http_requests_total[1h]))
          ) > 0.01
        for: 1h
        labels:
          severity: warning
          category: error_budget
        annotations:
          summary: "Error budget burn rate > 1x for API SLO"
          description: >
            API error rate is {{ $value | humanizePercentage }}, burning error budget
            faster than acceptable. Check error patterns and affected endpoints.

      - alert: ErrorBudgetBurnCritical
        expr: |
          (
            sum(rate(cosca_http_requests_total{status_code=~"5.."}[6h]))
            /
            sum(rate(cosca_http_requests_total[6h]))
          ) > 0.02
        for: 30m
        labels:
          severity: critical
          category: error_budget
        annotations:
          summary: "Error budget burn rate > 5x — freeze non-critical deployments"
          description: >
            Error budget is burning at a critical rate (>5x the acceptable rate).
            Consider freezing non-critical deployments until the issue is resolved,
            per the error budget policy defined in slos.md.
