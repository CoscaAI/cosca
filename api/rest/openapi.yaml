                  $ref: "#/components/schemas/ProviderInfo"

  /v1/providers/{name}:
    get:
      tags: [Providers]
      summary: Get provider info
      description: >-
        Returns detailed information about a single provider. Requires
        authentication.
      operationId: providersGet
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Provider name.
      responses:
        "200":
          description: Provider details.
          content:
            application/json:
              schema:
