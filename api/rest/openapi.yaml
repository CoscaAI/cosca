  /v1/providers/active:
    put:
      tags: [Providers]
      summary: Set active provider
      description: >-
        Sets the active LLM provider and optionally the model. Requires
        authentication.
      operationId: providersSetActive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActiveRequest"
      responses:
        "200":
          description: Updated provider status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # Workflows
  # ════════════════════════════════════════════════════════════════════
  /v1/workflows:
    get:
      tags: [Workflows]
      summary: List all workflows
      description: >-
        Returns all registered workflows with their steps, inputs, and
