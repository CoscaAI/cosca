  /v1/providers/{name}/test:
    post:
      tags: [Providers]
      summary: Test provider connection
      description: >-
        Tests connectivity to a specific provider and returns latency
        and status information. Requires authentication.
      operationId: providersTest
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Provider name to test.
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestResult"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
