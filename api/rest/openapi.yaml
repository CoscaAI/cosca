openapi: 3.0.3
info:
  title: Cosca REST API
  version: 1.3.0
  description: >-
    AI Orchestration System — Enterprise Platform API for managing
    knowledge, memory, agents, skills, providers, workflows, users,
    authentication, secrets, audit logs, and AI-powered orchestration.

    ## Authentication

    The API supports two authentication methods:

    1. **JWT Bearer Token** — Obtained via `POST /v1/auth/login`. Pass in
       the `Authorization: Bearer <token>` header. Also set automatically
       via httpOnly cookies for browser clients.

    2. **API Key** — Generated by admins via `POST /v1/api-keys`. Pass in
       the `X-API-Key` header.

    ## Rate Limiting

    - General endpoints: 100 requests/minute per IP.
    - Login endpoint (`POST /v1/auth/login`): 5 requests/minute per IP.
    - Exceeded limits return HTTP 429.

    ## Roles

    | Role   | Description |
    |--------|-------------|
    | admin  | Full system access, user/key/secret management |
    | editor | Read + write access to most resources |
    | viewer | Read-only access |

  contact:
    name: Cosca Team
  license:
    name: MIT

servers:
  - url: http://localhost:14120
    description: Local development server

tags:
  - name: System
    description: Health and readiness probes (Kubernetes-compatible)
  - name: Runtime
    description: Runtime engine status and component health
  - name: Knowledge
    description: Search, index, and sync the knowledge engine
  - name: Memory
    description: Store, retrieve, promote, and search memory records
  - name: Agents
    description: List, search, and inspect AI agents
  - name: Skills
    description: List, search, and inspect agent skills
  - name: Providers
    description: Manage LLM providers (list, test, set active)
  - name: Workflows
    description: List, search, inspect, and run workflows
  - name: Auth
    description: Authentication (login, refresh, me, logout, CSRF)
  - name: Users
    description: User management (admin only)
  - name: API Keys
    description: API key management (admin only)
  - name: Orchestration
    description: Execute AI prompts and stream responses
  - name: Executions
    description: Retrieve execution history
  - name: Audit
    description: Audit log retrieval (admin only)
  - name: Secrets
    description: Encrypted secrets vault (admin only)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    # ── Errors ────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.
          example: "resource not found"

    # ── System ────────────────────────────────────────────────────────
    HealthResponse:
      type: object
      properties:
        healthy:
          type: boolean
          example: true

    ReadyResponse:
      type: object
      properties:
        ready:
          type: boolean
          example: true
        subsystems:
          type: object
          additionalProperties:
            type: string
          example:
            knowledge: "available"
            memory: "available"
            runtime: "healthy"

    # ── Runtime ───────────────────────────────────────────────────────
    ComponentInfo:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [healthy, degraded, unhealthy, unknown]
        uptime:
          type: string
          example: "2h34m15s"
        message:
          type: string

    StatusResponse:
      type: object
      properties:
        state:
          type: string
          example: "running"
        health:
          type: string
          example: "healthy"
        uptime:
          type: string
          example: "2h34m15s"
        version:
          type: string
          example: "1.3.0"
        components:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ComponentInfo"

    RuntimeHealthResponse:
      type: object
      properties:
        healthy:
          type: boolean
        warnings:
          type: array
          items:
            type: string

    # ── Knowledge ─────────────────────────────────────────────────────
    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: Search query string.
          example: "How does the memory engine work?"
        limit:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
        offset:
          type: integer
          default: 0
        types:
          type: array
          items:
            type: string
          description: Filter by document type (e.g., code, markdown).
        path_filter:
          type: string
          description: Restrict search to a path prefix.
        min_score:
          type: number
          format: float
          description: Minimum relevance score (0.0–1.0).
        enable_fts:
          type: boolean
          description: Enable full-text search.
        enable_vector:
          type: boolean
          description: Enable vector similarity search.
        enable_graph:
          type: boolean
          description: Enable graph-based search.
        enable_facets:
          type: boolean
          description: Enable facet aggregation.
        tags:
          type: object
          additionalProperties:
            type: string
          description: Filter by metadata tags.

    SearchResult:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        snippet:
          type: string
        score:
          type: number
          format: float
        type:
          type: string
        path:
          type: string

    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        total:
          type: integer
        duration_ms:
          type: number
          format: float
        facets:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: integer

    IndexRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Path to a document or directory to index.
        recursive:
          type: boolean
          default: false
          description: If true, recursively index all files in a directory.

    IndexResponse:
      type: object
      properties:
        documents_indexed:
          type: integer
        chunks_indexed:
          type: integer
        errors:
          type: array
          items:
            type: string

    KnowledgeStatsResponse:
      type: object
      properties:
        document_count:
          type: integer
        chunk_count:
          type: integer
        entity_count:
          type: integer
        vector_count:
          type: integer
        db_size_bytes:
          type: integer
          format: int64
        uptime_seconds:
          type: number
          format: float
        cache_stats:
          type: object
          additionalProperties:
            type: integer
        graph_stats:
          type: object
          properties:
            nodes:
              type: integer
            edges:
              type: integer
            density:
              type: number
              format: float
            components:
              type: integer
            is_empty:
              type: boolean
        last_indexed:
          type: string
          format: date-time

    SyncResponse:
      type: object
      properties:
        added:
          type: integer
        updated:
          type: integer
        removed:
          type: integer
        errors:
          type: array
          items:
            type: string
        duration_ms:
          type: number
          format: float

    # ── Memory ────────────────────────────────────────────────────────
    MemoryStoreRequest:
      type: object
      required: [content]
      properties:
        type:
          type: string
          description: Memory type (e.g., fact, insight, context, decision).
        layer:
          type: string
          description: Memory layer (e.g., session, working, short_term, long_term, permanent).
          default: "session"
        scope:
          type: string
          description: Scope identifier for namespacing.
        content:
          type: string
          description: The memory content to store.
        priority:
          type: integer
          default: 0
        ttl:
          type: string
          description: Time-to-live duration (e.g., "24h", "7d").
        metadata:
          type: object
          additionalProperties:
            type: string

    MemoryStoreResponse:
      type: object
      properties:
        id:
          type: string
        created_at:
          type: string
          format: date-time

    MemoryRecord:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        layer:
          type: string
        content:
          type: string
        priority:
          type: integer
        created_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type: string

    MemorySearchResponse:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/MemoryRecord"
        total:
          type: integer

    MemoryGetResponse:
      type: object
      properties:
        record:
          $ref: "#/components/schemas/MemoryRecord"

    MemoryDeleteResponse:
      type: object
      properties:
        success:
          type: boolean

    MemoryPromoteRequest:
      type: object
      required: [id, from_layer, to_layer]
      properties:
        id:
          type: string
        from_layer:
          type: string
        to_layer:
          type: string

    MemoryPromoteResponse:
      type: object
      properties:
        record:
          $ref: "#/components/schemas/MemoryRecord"

    LayerStats:
      type: object
      properties:
        record_count:
          type: integer
        size_bytes:
          type: integer
          format: int64

    MemoryStatsResponse:
      type: object
      properties:
        layers:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/LayerStats"

    # ── Agents ────────────────────────────────────────────────────────
    TableRow:
      type: object
      properties:
        key:
          type: string
        value:
          type: string

    Capability:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    AgentTool:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        purpose:
          type: string

    Agent:
      type: object
      properties:
        name:
          type: string
          example: "cosca-documentation"
        role:
          type: string
          example: "Documentation Chief"
        mission:
          type: string
        status:
          type: string
        version:
          type: string
        department:
          type: string
        reports_to:
          type: string
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/AgentTool"
        responsibilities:
          type: array
          items:
            type: string
        description:
          type: string
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/TableRow"
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/TableRow"
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/TableRow"

    # ── Skills ────────────────────────────────────────────────────────
    SkillTool:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    Skill:
      type: object
      properties:
        name:
          type: string
          example: "customize-opencode"
        description:
          type: string
        version:
          type: string
        category:
          type: string
        instructions:
          type: string
        tools:
          type: array
          items:
            $ref: "#/components/schemas/SkillTool"
        source:
          type: string

    SkillInstallRequest:
      type: object
      required: [source]
      properties:
        source:
          type: string
          description: File path or URL to the skill definition (markdown format).
          example: "https://example.com/skills/my-skill.md"

    # ── Providers ─────────────────────────────────────────────────────
    ProviderInfo:
      type: object
      properties:
        name:
          type: string
          example: "openai"
        status:
          type: string
          example: "configured"
        model:
          type: string
          example: "gpt-4o"
        active:
          type: boolean
        configured:
          type: boolean
        base_url:
          type: string
        api_version:
          type: string
        models:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            type: string

    TestResult:
      type: object
      properties:
        response_time:
          type: string
          example: "245ms"
        model:
          type: string
        status:
          type: string
          example: "ok"

    SetActiveRequest:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          description: Provider name to set as active.
          example: "openai"
        model:
          type: string
          description: Model name to use (optional).
          example: "gpt-4o"

    ProviderStatus:
      type: object
      properties:
        active:
          type: string
        configured:
          type: integer
        available:
          type: integer
        statuses:
          type: array
          items:
            type: string

    # ── Workflows ─────────────────────────────────────────────────────
    WorkflowIO:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        required:
          type: boolean

    WorkflowStep:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        agent:
          type: string
        timeout:
          type: string

    Workflow:
      type: object
      properties:
        name:
          type: string
          example: "code-review"
        description:
          type: string
        version:
          type: string
        status:
          type: string
        enabled:
          type: boolean
        steps:
          type: integer
        step_list:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStep"
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowIO"
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowIO"

    WorkflowResult:
      type: object
      properties:
        status:
          type: string
          example: "completed"
        duration:
          type: string
          example: "2s"
        steps_completed:
          type: integer
        total_steps:
          type: integer
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowIO"

    # ── Auth ──────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 50
          example: "admin"
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128

    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Refresh token (optional; also accepted via cookie).

    TokenPair:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token (24h expiry).
        refresh_token:
          type: string
          description: JWT refresh token (7d expiry).
        expires_in:
          type: integer
          description: Seconds until access token expires.
          example: 86400

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        password_hash:
          type: string
          description: bcrypt hash (redacted in responses).
        role:
          type: string
          enum: [admin, editor, viewer]
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time

    CSRFResponse:
      type: object
      properties:
        token:
          type: string
          description: CSRF token for double-submit protection.

    LogoutResponse:
      type: object
      properties:
        message:
          type: string
          example: "logged out"

    # ── Users ─────────────────────────────────────────────────────────
    CreateUserRequest:
      type: object
      required: [username, password, role]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 50
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
        role:
          type: string
          enum: [admin, editor, viewer]
        email:
          type: string
          format: email
          maxLength: 254

    UpdateRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, editor, viewer]

    DeleteResponse:
      type: object
      properties:
        status:
          type: string
          example: "deleted"

    UpdateStatusResponse:
      type: object
      properties:
        status:
          type: string
          example: "updated"

    # ── API Keys ──────────────────────────────────────────────────────
    CreateAPIKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Human-readable name for the key.
        expires_in_days:
          type: integer
          description: Number of days until expiration (0 = never).

    APIKeyResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
          description: First 12 characters for UI display.
          example: "cosca_sk_AbCd"
        key:
          type: string
          description: Full API key (returned only once at creation).
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, revoked]
        created_by:
          type: string

    APIKeyListEntry:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        role:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, revoked]
        created_by:
          type: string
        hash:
          type: string
          description: SHA-256 hash of the key (persisted for validation).

    # ── Orchestration ─────────────────────────────────────────────────
    RunRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 10000
          description: The prompt to execute via the LLM.
          example: "Explain the memory layering system in Cosca."
        agent:
          type: string
          description: Optional agent name to use for context/personality.
        provider:
          type: string
          description: Optional provider name to override the active provider.
        stream:
          type: boolean
          default: false
          description: Whether to stream (used by /v1/run/stream).

    RunResponse:
      type: object
      properties:
        response:
          type: string
          description: The LLM-generated response text.
        agent:
          type: string
          example: "Cosca Assistant"
        skills_used:
          type: array
          items:
            type: string
        duration_ms:
          type: integer
          example: 1234
        memory_id:
          type: string
          description: UUID referencing the execution in history.

    # ── Executions ────────────────────────────────────────────────────
    Execution:
      type: object
      properties:
        id:
          type: string
          format: uuid
        prompt:
          type: string
        response:
          type: string
        agent:
          type: string
        provider:
          type: string
        model:
          type: string
        status:
          type: string
          enum: [success, error]
        duration_ms:
          type: integer
        created_at:
          type: string
          format: date-time
        skills_used:
          type: array
          items:
            type: string
        memory_id:
          type: string
        pipeline_trace:
          description: Optional pipeline execution trace data.

    ExecutionsListResponse:
      type: object
      properties:
        executions:
          type: array
          items:
            $ref: "#/components/schemas/Execution"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    # ── Audit ─────────────────────────────────────────────────────────
    AuditEntry:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        action:
          type: string
          example: "login"
        resource:
          type: string
          example: "auth"
        details:
          type: string
          description: JSON-encoded details.
        ip_address:
          type: string
        timestamp:
          type: integer
          format: int64
          description: Unix timestamp.
        status:
          type: string
          enum: [success, denied, error]

    AuditListResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    AuditPruneRequest:
      type: object
      properties:
        retention_days:
          type: integer
          default: 365
          minimum: 1
          description: Number of days of audit logs to keep. Defaults to 365 days if omitted or <= 0.
          example: 90

    AuditPruneResponse:
      type: object
      properties:
        deleted:
          type: integer
          description: Number of audit entries deleted.
          example: 42
        retention_days:
          type: integer
          description: The retention period used for this prune operation.
          example: 90
        cutoff:
          type: string
          format: date-time
          description: UTC timestamp of the oldest entry that was retained.
          example: "2026-04-28T12:00:00Z"

    # ── Secrets ───────────────────────────────────────────────────────
    CreateSecretRequest:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 100
          description: Secret identifier key.
        value:
          type: string
          description: Secret value to encrypt and store.
        type:
          type: string
          description: Secret type label (e.g., "api_token", "password").

    SecretStoredResponse:
      type: object
      properties:
        status:
          type: string
          example: "stored"
        key:
          type: string

    SecretValueResponse:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
          description: Decrypted value (returned only once; handle with care).
        type:
          type: string
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
        created_by:
          type: string

    SecretsListResponse:
      type: object
      properties:
        secrets:
          type: array
          items:
            type: string
          description: List of secret keys (values not included).
        count:
          type: integer

    DeleteSecretRequest:
      type: object
      required: [confirm_key]
      properties:
        confirm_key:
          type: string
          description: Must match the secret key being deleted.

    SecretDeletedResponse:
      type: object
      properties:
        status:
          type: string
          example: "deleted"
        key:
          type: string

  responses:
    BadRequest:
      description: Invalid request body or parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "invalid request body: unexpected end of JSON input"
    Unauthorized:
      description: Missing or invalid authentication credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "invalid credentials"
    Forbidden:
      description: Authenticated but not authorized for this resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "forbidden: insufficient permissions"
    NotFound:
      description: Requested resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "not found"
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "rate limit exceeded"
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "internal server error"
    ServiceUnavailable:
      description: Subsystem not available.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "service not available"

security:
  - BearerAuth: []
  - ApiKeyAuth: []

paths:
  # ════════════════════════════════════════════════════════════════════
  # System
  # ════════════════════════════════════════════════════════════════════
  /health:
    get:
      tags: [System]
      summary: Liveness probe
      description: >-
        Simple liveness check for Kubernetes probes. Returns 200 if the
        server process is alive. No authentication required.
      operationId: systemHealth
      security: []
      responses:
        "200":
          description: Server is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                healthy: true

  /ready:
    get:
      tags: [System]
      summary: Readiness probe
      description: >-
        Readiness check with subsystem verification. Returns 200 if all
        subsystems (knowledge, memory, runtime) are healthy, or 503 if
        any are degraded. No authentication required.
      operationId: systemReady
      security: []
      responses:
        "200":
          description: All subsystems healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
              example:
                ready: true
                subsystems:
                  knowledge: "available"
                  memory: "available"
                  runtime: "healthy"
        "503":
          description: One or more subsystems unhealthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"

  # ════════════════════════════════════════════════════════════════════
  # Runtime
  # ════════════════════════════════════════════════════════════════════
  /v1/status:
    get:
      tags: [Runtime]
      summary: Runtime status
      description: >-
        Returns the full runtime status including state, health, uptime,
        version, and per-component status. Requires authentication.
      operationId: runtimeStatus
      responses:
        "200":
          description: Runtime status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /v1/health:
    get:
      tags: [Runtime]
      summary: Runtime health
      description: >-
        Returns the runtime health state with optional warnings for
        degraded components. Requires authentication.
      operationId: runtimeHealth
      responses:
        "200":
          description: Runtime health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeHealthResponse"

  # ════════════════════════════════════════════════════════════════════
  # Knowledge
  # ════════════════════════════════════════════════════════════════════
  /v1/knowledge/search:
    post:
      tags: [Knowledge]
      summary: Search the knowledge base
      description: >-
        Full-text, vector, and graph-based search across the indexed
        knowledge base. Supports filters, facets, and tag-based queries.
        Requires authentication.
      operationId: knowledgeSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/knowledge/index:
    post:
      tags: [Knowledge]
      summary: Index a document or directory
      description: >-
        Index a single document or recursively index an entire directory
        into the knowledge engine. Requires authentication.
      operationId: knowledgeIndex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexRequest"
      responses:
        "200":
          description: Index operation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/knowledge/stats:
    get:
      tags: [Knowledge]
      summary: Knowledge engine statistics
      description: >-
        Returns statistics about the knowledge engine including document
        counts, chunk counts, database size, uptime, and graph metrics.
        Requires authentication.
      operationId: knowledgeStats
      responses:
        "200":
          description: Knowledge engine statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeStatsResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/knowledge/sync:
    post:
      tags: [Knowledge]
      summary: Sync knowledge index
      description: >-
        Synchronizes the knowledge index, detecting and processing added,
        updated, and removed documents. Requires authentication.
      operationId: knowledgeSync
      responses:
        "200":
          description: Sync result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # ════════════════════════════════════════════════════════════════════
  # Memory
  # ════════════════════════════════════════════════════════════════════
  /v1/memory/store:
    post:
      tags: [Memory]
      summary: Store a memory record
      description: >-
        Store a new memory record in the specified layer. Records support
        optional TTL for automatic expiration. Defaults to the session
        layer if not specified. Requires authentication.
      operationId: memoryStore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryStoreRequest"
      responses:
        "201":
          description: Memory record created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryStoreResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/memory/search:
    get:
      tags: [Memory]
      summary: Search memory records
      description: >-
        Search memory records by query string with optional filters for
        types and layers. Requires authentication.
      operationId: memorySearch
      parameters:
        - name: query
          in: query
          schema:
            type: string
          description: Search query string.
        - name: types
          in: query
          schema:
            type: array
            items:
              type: string
          description: Filter by memory types (repeatable).
        - name: layers
          in: query
          schema:
            type: array
            items:
              type: string
          description: Filter by memory layers (repeatable).
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Maximum records to return.
      responses:
        "200":
          description: Search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemorySearchResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/memory/get:
    get:
      tags: [Memory]
      summary: Get a memory record
      description: >-
        Retrieve a single memory record by ID and layer. Requires
        authentication.
      operationId: memoryGet
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Memory record ID.
        - name: layer
          in: query
          required: true
          schema:
            type: string
          description: Memory layer name.
      responses:
        "200":
          description: Memory record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryGetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/memory/delete:
    delete:
      tags: [Memory]
      summary: Delete a memory record
      description: >-
        Deletes a memory record by ID and optional layer. Requires
        authentication. Note: deletion via API is not fully implemented
        in the current engine version.
      operationId: memoryDelete
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Memory record ID.
        - name: layer
          in: query
          schema:
            type: string
          description: Memory layer name.
      responses:
        "200":
          description: Deletion confirmation (when implemented).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryDeleteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          description: Not implemented (current engine limitation).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/memory/promote:
    post:
      tags: [Memory]
      summary: Promote a memory record
      description: >-
        Promote a memory record from one layer to another (e.g., from
        working memory to long-term memory). Requires authentication.
      operationId: memoryPromote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryPromoteRequest"
      responses:
        "200":
          description: Promoted memory record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryPromoteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/memory/stats:
    get:
      tags: [Memory]
      summary: Memory engine statistics
      description: >-
        Returns per-layer statistics including record counts and storage
        sizes. Requires authentication.
      operationId: memoryStats
      responses:
        "200":
          description: Memory layer statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryStatsResponse"

  # ════════════════════════════════════════════════════════════════════
  # Agents
  # ════════════════════════════════════════════════════════════════════
  /v1/agents:
    get:
      tags: [Agents]
      summary: List all agents
      description: >-
        Returns all registered AI agents with their capabilities, tools,
        responsibilities, and metadata. Requires authentication.
      operationId: agentsList
      responses:
        "200":
          description: List of agents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"

  /v1/agents/search:
    get:
      tags: [Agents]
      summary: Search agents
      description: >-
        Search agents by name or keyword query. Requires authentication.
      operationId: agentsSearch
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query for agent names.
      responses:
        "200":
          description: Matching agents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/agents/{name}:
    get:
      tags: [Agents]
      summary: Get agent by name
      description: >-
        Returns detailed information about a single agent by its name.
        Requires authentication.
      operationId: agentsGet
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Agent name.
      responses:
        "200":
          description: Agent details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # Skills
  # ════════════════════════════════════════════════════════════════════
  /v1/skills:
