      operationId: workflowsList
      responses:
        "200":
          description: List of workflows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workflow"

  /v1/workflows/search:
    get:
      tags: [Workflows]
      summary: Search workflows
      description: >-
        Search workflows by name or keyword query. Requires
        authentication.
      operationId: workflowsSearch
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query for workflow names.
      responses:
        "200":
          description: Matching workflows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/workflows/{name}:
    get:
      tags: [Workflows]
      summary: Get workflow by name
      description: >-
        Returns detailed information about a single workflow. Requires
        authentication.
      operationId: workflowsGet
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Workflow name.
      responses:
        "200":
          description: Workflow details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/workflows/{name}/run:
    post:
      tags: [Workflows]
      summary: Run a workflow
      description: >-
        Executes a workflow by name and returns the result. Requires
        authentication.
      operationId: workflowsRun
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Workflow name to execute.
      responses:
        "200":
          description: Workflow execution result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResult"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # Auth
  # ════════════════════════════════════════════════════════════════════
  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and get tokens
      description: >-
        Authenticates a user with username and password. Returns a JWT
        token pair (access + refresh). Also sets httpOnly cookies for
        browser clients. No prior authentication required.
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful.
          headers:
            Set-Cookie:
              description: >-
                Auth cookies set for browser clients (httpOnly, SameSite=Strict).
                Includes cosca_access_token (24h), cosca_refresh_token (7d),
                and cosca_auth_state (non-httpOnly for JS detection).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: >-
        Validates the refresh token (from cookie or JSON body) and returns
        a new token pair. No prior authentication required.
      operationId: authRefresh
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New token pair generated.
          headers:
            Set-Cookie:
              description: New httpOnly cookies set for browser clients.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      description: >-
        Returns the currently authenticated user from the JWT token.
        Requires a valid access token.
      operationId: authMe
      responses:
        "200":
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout and clear cookies
      description: >-
        Clears all auth-related httpOnly cookies by setting MaxAge=-1.
        No prior authentication required.
      operationId: authLogout
      security: []
      responses:
        "200":
          description: Logged out successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"

  /v1/csrf-token:
    get:
      tags: [Auth]
      summary: Get CSRF token
      description: >-
        Generates a CSRF token and sets it as a cookie for double-submit
        CSRF protection. The token is also returned in the response body
        for use in the X-CSRF-Token header. No prior authentication
        required.
      operationId: csrfToken
      security: []
      responses:
        "200":
          description: CSRF token created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CSRFResponse"
          example:
            token: "a1b2c3d4..."
        "500":
          $ref: "#/components/responses/InternalError"

  # ════════════════════════════════════════════════════════════════════
  # Users (admin only)
  # ════════════════════════════════════════════════════════════════════
  /v1/users:
    get:
      tags: [Users]
      summary: List all users
      description: >-
        Returns all registered users. Requires admin role.
      operationId: usersList
      responses:
        "200":
          description: List of users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    post:
      tags: [Users]
      summary: Create a user
      description: >-
        Creates a new user with the specified credentials and role.
        Requires admin role.
      operationId: usersCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: User already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/users/{id}:
    delete:
      tags: [Users]
      summary: Delete a user
      description: >-
        Removes a user by ID. Requires admin role.
      operationId: usersDelete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: User ID.
      responses:
        "200":
          description: User deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/users/{id}/role:
    put:
      tags: [Users]
      summary: Update user role
      description: >-
        Changes a user's role. Requires admin role.
      operationId: usersUpdateRole
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: User ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: Role updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # API Keys (admin only)
  # ════════════════════════════════════════════════════════════════════
  /v1/api-keys:
    get:
      tags: [API Keys]
      summary: List all API keys
      description: >-
        Returns all API keys with metadata (without the secret key itself).
        Requires admin role.
      operationId: apiKeysList
      responses:
        "200":
          description: List of API keys.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIKeyListEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    post:
      tags: [API Keys]
      summary: Generate an API key
      description: >-
        Generates a new API key. The full key (`key` field) is returned
        only once in this response and cannot be retrieved later. Store
        it securely. Requires admin role.
      operationId: apiKeysCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyRequest"
      responses:
        "201":
          description: API key generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/api-keys/{id}:
    delete:
      tags: [API Keys]
      summary: Revoke an API key
      description: >-
        Revokes an API key, preventing further use. Requires admin role.
      operationId: apiKeysRevoke
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: API key ID.
      responses:
        "200":
          description: Key revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "revoked"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # Orchestration
  # ════════════════════════════════════════════════════════════════════
  /v1/run:
    post:
      tags: [Orchestration]
      summary: Execute an AI prompt
      description: >-
        Executes a prompt through the LLM and returns the complete response.
        Optionally specify an agent for context/personality or a provider
        to override the active one. The execution is recorded in history.
        Requires authentication.
      operationId: runExecute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "200":
          description: AI response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/run/stream:
    post:
      tags: [Orchestration]
      summary: Execute an AI prompt with streaming
      description: >-
        Executes a prompt via the LLM and streams the response back as
        Server-Sent Events (SSE). The stream includes thinking, response,
        error, and done events. The execution is recorded in history upon
        completion. Requires authentication.
      operationId: runStream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "200":
          description: SSE stream of AI responses.
          content:
            text/event-stream:
              schema:
                type: string
                description: >-
                  Server-Sent Events stream. Event types:
                  - `thinking`: "Analyzing request..."
                  - `response`: Chunk of the generated text.
                  - `error`: Stream error message.
                  - `done`: Completion with `duration_ms`.
                example: |
                  data: {"type":"thinking","content":"Analyzing request and preparing response..."}

                  data: {"type":"response","content":"The Cosca memory system..."}

                  data: {"type":"done","duration_ms":1234}
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # Executions
  # ════════════════════════════════════════════════════════════════════
  /v1/executions:
    get:
      tags: [Executions]
      summary: List executions
      description: >-
        Returns a paginated list of past AI orchestration executions
        with optional filtering by agent and status. Requires
        authentication.
      operationId: executionsList
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Maximum records per page.
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Records to skip.
        - name: agent
          in: query
          schema:
            type: string
          description: Filter by agent name.
        - name: status
          in: query
          schema:
            type: string
            enum: [success, error]
          description: Filter by execution status.
      responses:
        "200":
          description: Paginated execution list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionsListResponse"

  /v1/executions/{id}:
    get:
      tags: [Executions]
      summary: Get execution by ID
      description: >-
        Returns the full detail of a single execution, including pipeline
        trace if available. Requires authentication.
      operationId: executionsGet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Execution ID.
      responses:
        "200":
          description: Execution detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ════════════════════════════════════════════════════════════════════
  # Audit (admin only)
  # ════════════════════════════════════════════════════════════════════
  /v1/audit/logs:
    get:
      tags: [Audit]
      summary: List audit log entries
      description: >-
        Returns a paginated, filterable list of audit log entries.
        Supports CSV export via `format=csv`. Requires admin role.
      operationId: auditList
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 1000
          description: Maximum records per page.
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Records to skip.
        - name: user_id
          in: query
          schema:
            type: string
          description: Filter by user ID.
        - name: action
          in: query
          schema:
            type: string
          description: Filter by action (e.g., "login", "user.create").
        - name: resource
          in: query
          schema:
            type: string
          description: Filter by resource.
        - name: status
          in: query
          schema:
            type: string
            enum: [success, denied, error]
          description: Filter by status.
        - name: from
          in: query
          schema:
            type: string
          description: >-
            Filter entries after this time. Accepts a Unix timestamp
            (integer) or RFC3339 date string (e.g., "2026-04-28T00:00:00Z").
            Also accepts date-only format (e.g., "2026-04-28").
          example: "2026-01-01T00:00:00Z"
        - name: to
          in: query
          schema:
            type: string
          description: >-
            Filter entries before this time. Accepts a Unix timestamp
            (integer) or RFC3339 date string (e.g., "2026-07-28T23:59:59Z").
            Also accepts date-only format (e.g., "2026-07-28").
          example: "2026-06-30T23:59:59Z"
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            default: json
          description: Output format. Use "csv" for CSV download.
      responses:
        "200":
          description: Audit entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditListResponse"
            text/csv:
              schema:
                type: string
                description: CSV file download (when format=csv).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/audit/logs/{id}:
    get:
      tags: [Audit]
      summary: Get audit log entry by ID
      description: >-
        Returns a single audit log entry. Requires admin role.
      operationId: auditGet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Audit entry ID.
      responses:
        "200":
          description: Audit entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/audit/prune:
    post:
      tags: [Audit]
      summary: Prune old audit log entries
      description: >-
        Deletes audit log entries older than the specified retention period.
        Defaults to 365 days if no retention_days is provided or if the value
        is <= 0. Requires admin role.
      operationId: auditPrune
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditPruneRequest"
      responses:
        "200":
          description: Prune operation completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPruneResponse"
              example:
                deleted: 42
                retention_days: 90
                cutoff: "2026-04-28T00:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # Secrets (admin only)
  # ════════════════════════════════════════════════════════════════════
  /v1/secrets:
    get:
      tags: [Secrets]
      summary: List all secret keys
      description: >-
        Returns all stored secret keys without their values. Requires
        admin role.
      operationId: secretsList
      responses:
        "200":
          description: List of secret keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretsListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    post:
      tags: [Secrets]
      summary: Create or update a secret
      description: >-
        Creates or updates a secret. The value is encrypted at rest using
        AES-256-GCM. Requires admin role.
      operationId: secretsCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecretRequest"
      responses:
        "200":
          description: Secret stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretStoredResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/secrets/{key}:
    get:
      tags: [Secrets]
      summary: Get a secret value
      description: >-
        Returns a single secret with its decrypted value. The decrypted
        value must be handled with care and should not be persisted in
        logs. Requires admin role.
      operationId: secretsGet
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: Secret key.
      responses:
        "200":
          description: Secret with decrypted value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretValueResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    delete:
      tags: [Secrets]
      summary: Delete a secret
      description: >-
        Deletes a secret. Requires the `confirm_key` field to match the
        secret key being deleted to prevent accidental deletion. Requires
        admin role.
      operationId: secretsDelete
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: Secret key to delete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteSecretRequest"
      responses:
        "200":
          description: Secret deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretDeletedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
