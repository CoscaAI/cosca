        "200":
          description: List of skills.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"

  /v1/skills/search:
    get:
      tags: [Skills]
      summary: Search skills
      description: >-
        Search skills by name or keyword query. Requires authentication.
      operationId: skillsSearch
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query for skill names.
      responses:
        "200":
          description: Matching skills.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/skills/{name}:
    get:
      tags: [Skills]
      summary: Get skill by name
      description: >-
        Returns detailed information about a single skill. Requires
        authentication.
      operationId: skillsGet
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Skill name.
      responses:
        "200":
          description: Skill details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/skills/{name}/install:
    post:
      tags: [Skills]
      summary: Install a skill from a source
      description: >-
        Installs a new skill from a file path or URL. The skill definition
        is parsed from a markdown file, stored in-memory, and persisted to
        the cosca skills directory. Requires admin role.
      operationId: skillsInstall
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Name to assign to the installed skill.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillInstallRequest"
      responses:
        "201":
          description: Skill installed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
